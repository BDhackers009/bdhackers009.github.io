# Site settings
title: Mustakim Ahmed Sifat
author:
  name: Mustakim Ahmed Sifat
  handle: BDhackers009
description: Security tooling for Android and Linux, built mostly in Termux. CTF writeups and notes.
url: https://bdhackers009.is-a.dev
baseurl: ""

# Public email. Leave empty to hide the row on the contact section.
email: ""

timezone: Asia/Dhaka
permalink: /writing/:title/

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

# Posts get their layout automatically, so a new file can start with an
# empty front-matter block and nothing else.
defaults:
  - scope:
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
