<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_newlines | escape }}">
<meta name="author" content="{{ site.author.name }}">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111112" media="(prefers-color-scheme: dark)">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">

<meta property="og:type" content="{% if page.collection == 'posts' %}article{% else %}website{% endif %}">
<meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
<meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="site-header wrap">
  <a class="site-title" href="{{ '/' | relative_url }}">{{ site.author.name }}</a>
  <nav class="site-nav" aria-label="Main">
    <a href="{{ '/' | relative_url }}#work">Work</a>
    <a href="{{ '/writing/' | relative_url }}"{% if page.url contains '/writing' or page.collection == 'posts' %} aria-current="page"{% endif %}>Writing</a>
    <a href="{{ '/' | relative_url }}#contact">Contact</a>
  </nav>
</header>

<main id="main" class="wrap">
{{ content }}
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <p>&copy; {{ site.time | date: "%Y" }} {{ site.author.name }}</p>
    <p>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a> ·
      <a href="https://github.com/BDhackers009/bdhackers009.github.io">Source</a>
    </p>
  </div>
</footer>
</body>
</html>
